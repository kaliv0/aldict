[project]
name = "aldict"
requires-python = ">=3.10"
authors = [
    { name = "kaliv0", email = "kaliv.zero@gmail.com" },
]
description = "Multi-key dictionary, supports adding and manipulating key-aliases pointing to shared values"
keywords = ["multi-key dictionary", "multidict", "alias-dict"]
readme = "README.md"
license-files = ["LICENSE"]
urls = { repository = "https://github.com/kaliv0/aldict" }

dynamic = ["version"]

[dependency-groups]
dev = [
    "ruff>=0.12.4",
    "pytest>=8.3.2"
]

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.pdm.version]
source = "file"
path = "aldict/__init__.py"

[tool.pdm.build]
excludes = ["tests/"]

[tool.ruff]
fix = true
line-length = 110
